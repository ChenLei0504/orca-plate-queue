name: Windows Python compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Runtime and Windows ctypes regression tests
        run: python -X utf8 -m unittest discover -q
      - name: Publishing validation tests (offline only)
        run: python -X utf8 -m unittest ci.test_publish_orcacloud -q
