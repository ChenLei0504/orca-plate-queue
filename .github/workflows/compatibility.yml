name: Queue compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Build plugin fixture from checked-out source
        run: python -X utf8 build_plugin.py
      - name: Runtime and Windows ctypes regression tests
        run: python -X utf8 -m unittest discover -q
      - name: Connection installer compatibility and rollback (offline only)
        if: matrix.python == '3.12'
        run: python -X utf8 build_connection_installer.py
      - name: Publishing validation tests (offline only)
        run: python -X utf8 -m unittest ci.test_publish_orcacloud -q

  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned DOM test dependencies
        run: npm ci --prefix .ui-test-tools --ignore-scripts
      - name: Chinese and English UI regression tests
        run: node test_page.cjs

  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Independent provider ABI and lifetime (fake host only)
        run: python native/build_sidecar.py
